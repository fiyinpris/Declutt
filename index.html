<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>Declutt</title>

  <!-- Favicon & App Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/images/decluttlogo3.png?v=2" />
  <link rel="apple-touch-icon" sizes="180x180" href="/images/decluttlogo3.png?v=2" />

  <!-- Page background before the stylesheet loads. Class-based (not an inline style) so it
       follows theme changes; colours = --background in src/index.css. -->
  <style>
    html { background-color: hsl(30 14% 80%); }
    html.dark { background-color: hsl(30 28% 8%); }
  </style>
  <meta name="theme-color" content="hsl(30 14% 80%)" />

  <!-- Theme script -->
  <script>
    (function () {
      const saved = localStorage.getItem("theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      const isDark = saved === "dark" || (!saved && prefersDark);

      if (isDark) {
        document.documentElement.classList.add("dark");
        // browser toolbar colour (mobile) — kept in sync by src/utils/theme.js
        document.querySelector('meta[name="theme-color"]').content = "hsl(30 28% 8%)";
      }
    })();
  </script>

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
